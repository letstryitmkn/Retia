<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B3BA93">
  <meta name="description" content="Seven notes a day on politics, philosophy and economics.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Retia">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Retia</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <!-- ?v= must match VERSION in sw.js; change both on every release so phones never mix old and new files -->
  <link rel="stylesheet" href="style.css?v=4">
  <link rel="preload" href="assets/splash.jpg" as="image">
</head>
<body>

  <!-- Loading screen -->
  <!-- The artwork (assets/splash.jpg) already contains the icon, name and quote -->
  <section id="splash" class="screen splash" role="img" aria-label="Retia. Icarus laughed as he fell, for he knew: to fall means to once have soared.">
    <div class="splash-frame" aria-hidden="true"></div>
    <div class="splash-bottom">
      <div class="loading-line" aria-hidden="true"><i></i></div>
      <div class="continue">Touch to continue</div>
    </div>
  </section>

  <!-- Reading a note -->
  <section id="read" class="screen paper" hidden>
    <header class="topbar">
      <span id="r-where"></span>
      <span class="topright"><span id="r-count"></span><button class="menu" type="button" data-menu aria-label="Contents"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg></button></span>
    </header>
    <div class="dots" id="r-dots"></div>
    <div class="arrears" id="r-arrears" hidden></div>
    <button class="reminder" id="r-reminder" type="button" hidden></button>
    <article class="note" id="r-note">
      <div class="subject" id="r-subject"></div>
      <h1 class="title" id="r-title"></h1>
      <div class="pages" id="r-pages"></div>
      <div class="body" id="r-body"></div>
    </article>
    <footer class="actions">
      <div class="row">
        <button class="ghost" id="b-lookup" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
          Look it up
        </button>
        <button class="ghost" id="b-ask" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L13.8 10.2 L21 12 L13.8 13.8 L12 21 L10.2 13.8 L3 12 L10.2 10.2 Z"/></svg>
          Ask AI
        </button>
      </div>
      <button class="primary" id="b-understood" type="button">Understood</button>
    </footer>
  </section>

  <!-- Recollection -->
  <section id="recall" class="screen paper" hidden>
    <header class="topbar"><span>Recollection</span><span id="c-count"></span></header>
    <div class="recall-q">
      <div class="whatis">What is…</div>
      <h1 class="title" id="c-title"></h1>
      <div class="hint" id="c-hint"></div>
    </div>
    <article class="note recall-a" id="c-answer" hidden>
      <div class="subject" id="c-subject"></div>
      <div class="body" id="c-body"></div>
    </article>
    <footer class="actions">
      <button class="outline" id="b-see" type="button">See answer</button>
      <div class="row" id="c-judge" hidden>
        <button class="outline" id="b-remembered" type="button">Remembered</button>
        <button class="outline" id="b-forgotten" type="button">Forgotten</button>
      </div>
    </footer>
  </section>

  <!-- Day sealed -->
  <section id="sealed" class="screen paper centered" hidden>
    <header class="topbar">
      <span id="s-where"></span>
      <span class="topright"><span id="s-count"></span><button class="menu" type="button" data-menu aria-label="Contents"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg></button></span>
    </header>
    <div class="spacer"></div>
    <svg class="seal" id="s-seal" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M50 8 C62 6 68 14 78 16 C88 22 86 32 92 40 C96 52 88 58 90 68 C86 80 76 80 70 88 C60 94 52 90 42 94 C30 92 28 84 18 80 C10 72 14 62 8 54 C6 42 14 38 14 28 C20 16 30 18 38 10 C42 8 46 9 50 8Z" fill="#9B2D20"/>
      <circle cx="50" cy="51" r="30" fill="none" stroke="#7E2418" stroke-width="2"/>
      <circle cx="50" cy="51" r="26" fill="none" stroke="#7E2418" stroke-width="0.6"/>
      <text x="50" y="63" text-anchor="middle" font-family="'IM Fell English SC', serif" font-size="34" fill="#E9C9B8">R</text>
    </svg>
    <h1 class="sealed-title" id="s-title"></h1>
    <p class="sealed-sub" id="s-sub"></p>
    <p class="sealed-streak" id="s-streak"></p>
    <div class="spacer"></div>
    <p class="morrow">Return on the morrow.</p>
    <button class="link" id="b-revisit" type="button">Revisit today's notes</button>
  </section>

  <!-- Messages -->
  <section id="message" class="screen paper centered" hidden>
    <header class="topbar" style="width:100%">
      <span></span>
      <span class="topright"><button class="menu" type="button" data-menu aria-label="Contents"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg></button></span>
    </header>
    <div class="spacer"></div>
    <h1 class="sealed-title" id="m-title"></h1>
    <p class="sealed-sub" id="m-text"></p>
    <div class="spacer"></div>
  </section>

  <!-- Contents, Progress, Library, Look up later, Settings -->
  <section id="page" class="screen paper" hidden>
    <header class="pagebar">
      <button class="back" id="p-back" type="button">‹ Back</button>
      <h1 class="page-title" id="p-title"></h1>
      <span class="pagebar-end"></span>
    </header>
    <div class="page-body" id="p-body"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js?v=4"></script>
</body>
</html>
